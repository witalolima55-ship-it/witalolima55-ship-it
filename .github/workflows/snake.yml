# Salve este arquivo em: .github/workflows/snake.yml
# dentro do repositório especial witalolima55-ship-it/witalolima55-ship-it
# (crie esse repositório público com esse nome exato, se ainda não existir)

name: Snake generation

on:
  schedule:
    - cron: "0 0 * * *"   # roda 1x por dia
  workflow_dispatch: {}     # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar SVGs da snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publicar na branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
